name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    # paths-ignore для PR намеренно убран: docs-only PR должны получать
    # статус-checks, иначе они не проходят правило ветки main и внешний
    # контрибьютор не может прислать документацию (аудит, §7.4).
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Black formatter check
      run: black --check src/ tests/ main.py

    - name: Run isort import sorter check
      run: isort --check-only src/ tests/ main.py

    - name: Run Ruff (syntax, undefined names, bugbear)
      run: ruff check src/ tests/ main.py

    - name: Run MyPy type checker (advisory)
      run: mypy src/hipporag --ignore-missing-imports
      continue-on-error: true

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests
      run: pytest tests/unit -v -m unit

  eval-smoke:
    name: Eval Smoke (10 questions, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Eval contract and metrics smoke
      run: pytest tests/unit/test_eval_smoke_contract.py -v

  index-fixture:
    name: Index Fixture Smoke (BM25, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Detect index fixture
      id: fixture
      run: |
        if [ -f fixtures/astrology_mini/fixture.json ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Индекс-фикстура не в репозитории: сборка за владельцем (scripts/build_index_fixture.py). Джоб публикует отчёт-заглушку, а не результат retrieval."
        fi

    - name: BM25 smoke over fixture (no LLM, no models)
      if: steps.fixture.outputs.present == 'true'
      run: |
        python scripts/index_fixture_smoke.py \
          --fixture fixtures/astrology_mini \
          --limit 10 \
          --top-k 5 \
          --out outputs/reports/fixture_smoke.json \
          --markdown-out outputs/reports/fixture_smoke.md

    - name: Publish fixture and smoke report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: index-fixture-and-smoke-report
        path: |
          fixtures/astrology_mini
          outputs/reports/fixture_smoke.json
          outputs/reports/fixture_smoke.md
        if-no-files-found: warn
        retention-days: 30

  clone-smoke:
    name: Clone Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Clone tracked tree into a clean directory
      run: git clone --depth 1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clone"

    - name: Install from the clone
      working-directory: ${{ runner.temp }}/clone
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Smoke import and LLM-free path
      working-directory: ${{ runner.temp }}/clone
      run: |
        python -c "import main; print('clone import main: ok')"
        python -c "from astro_app.signs import _sign_in_query; assert _sign_in_query('марс в овне') == 'овен'; print('LLM-free mode helper: ok')"

  wheel-smoke:
    name: Wheel Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Build and check wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build --wheel
        python -m twine check dist/*

    - name: Install wheel into a clean venv
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

    - name: Smoke installed wheel
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/venv/bin/python" -c "import astro_app.cli; from astro_app.synonyms import load_synonyms; data = load_synonyms(); assert len(data) == 66, len(data); print('wheel import + 66 synonyms: ok')"
        "$RUNNER_TEMP/venv/bin/hipo-rag" --help
